services:
  claude-web:
    image: claude-web:1.0.0
    build: .
    restart: unless-stopped
    environment:
      CLAUDE_WEB_USERNAME: ${CLAUDE_WEB_USERNAME:-admin}
      CLAUDE_WEB_PASSWORD: ${CLAUDE_WEB_PASSWORD:?Set CLAUDE_WEB_PASSWORD in .env}
      CLAUDE_WEB_ACCESS_MODE: ${CLAUDE_WEB_ACCESS_MODE:-workspace}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8081}:8766"
    volumes:
      - ./data:/data
      - ./workspace:/workspace
