services:
  codex-web:
    image: codex-web:1.4.0
    build: .
    restart: unless-stopped
    environment:
      CODEX_WEB_USERNAME: ${CODEX_WEB_USERNAME:-admin}
      CODEX_WEB_PASSWORD: ${CODEX_WEB_PASSWORD:?Set CODEX_WEB_PASSWORD in .env}
      CODEX_WEB_ACCESS_MODE: ${CODEX_WEB_ACCESS_MODE:-workspace}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8765"
    volumes:
      - codex-data:/data
      - codex-workspace:/workspace
volumes:
  codex-data:
  codex-workspace:
